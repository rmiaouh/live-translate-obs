name: Release installers

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-preview.') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Restore Windows certificate
        if: runner.os == 'Windows' && env.CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: '[IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\certificate.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make -- --arch=${{ matrix.arch }}
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}/certificate.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          LIVE_TRANSLATE_UPDATE_URL: ${{ vars.LIVE_TRANSLATE_UPDATE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: live-translate-${{ runner.os }}-${{ matrix.arch }}
          path: out/make/**

  publish:
    if: ${{ !contains(github.ref_name, '-preview.') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" --generate-notes
